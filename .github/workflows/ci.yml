name: Validate album
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install only the deployable web workspace
        run: npm ci --workspace=@fami-li/web --include-workspace-root=false --include=dev
      - name: Build the isolated web workspace
        run: npm run build --workspace=@fami-li/web
